[project]
name = "runpyrs"
version = "0.1.0"
description = "Python worker SDK for the Runpy manager — build workers that are spawned and orchestrated by Rust."
readme = "README.md"
license = "Apache-2.0"
# A symlink to the repository LICENSE; builds include its contents.
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "dark1zinn" },
]
dependencies = []

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

# The sdist keeps the src/ layout so a wheel built from it finds the package.
[tool.hatch.build.targets.sdist]
include = ["src/runpyrs", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/runpyrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/dark1zinn/runpy"
Repository = "https://github.com/dark1zinn/runpy"
