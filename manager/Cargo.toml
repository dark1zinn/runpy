[package]
name = "runpy"
version = "0.1.0"
edition = "2024"
authors = ["dark1zinn"]
keywords = ["python", "script", "manager", "runner"]
description = "A Rust manager for running and controlling Python scripts"
repository = "https://github.com/dark1zinn/runpy"
readme = "../README.md"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
chrono = "0.4"
rand = "0.8"
libc = "0.2"
parking_lot = "0.12"
tempfile = "3"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full", "test-util"] }

[lib]
name = "runpy"
path = "src/lib.rs"
