[project]
name = "runpy-monorepo"
version = "0.1.0"

[tool.uv.workspace]
# This tells uv to look into these folders for sub-projects
members = ["worker"]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["worker/src/runpyrs", "examples/playground/worker/my_script.py"]
