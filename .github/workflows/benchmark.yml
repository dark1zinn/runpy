name: Benchmarks

# Measurements only: reports are kept as workflow artifacts (never release
# assets), and possible regressions are flagged for review instead of failing
# the run, because shared runners are noisy.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    env:
      LOG: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned so reports stay comparable across runs.
          toolchain: 1.93.0

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build runner
        run: cargo build --release --locked -p performance

      - name: Run real-uv runner three times
        run: |
          mkdir -p reports
          for run in 1 2 3; do
            ./target/release/performance run --output "reports/run-$run.json"
          done

      - name: Run Criterion transport benchmarks
        run: cargo bench --locked -p runpy --bench transport

      # The baseline is the latest successful run of this workflow on main,
      # which ran on the same runner image class and pinned toolchain.
      - name: Download baseline reports
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow benchmark.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name benchmark-reports --dir baseline
          fi

      - name: Flag median regressions over 20%
        run: |
          if ls baseline/reports/run-*.json >/dev/null 2>&1; then
            ./target/release/performance compare \
              --baseline baseline/reports/run-*.json \
              --current reports/run-*.json | tee reports/comparison.txt
          else
            echo "No baseline yet; this run becomes the baseline." | tee reports/comparison.txt
          fi

      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-reports
          retention-days: 90
          path: |
            reports/
            target/criterion/
