name: Pre-Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-dev'
      - 'v[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+'

jobs:
  pre-release:
    name: Pre-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag format (must be vX.X.X-dev or vX.X.X-dev.X)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match pre-release format vX.X.X-dev or vX.X.X-dev.X"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "✓ Valid pre-release tag: $TAG"

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pre-Release ${{ env.TAG }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
